name: pruebas

on:
  push:
  pull_request:

jobs:
  privacidad:
    # Solo en la plantilla: las copias de los usuarios (privadas) no gastan sus minutos de Actions en cada cierre.
    if: github.repository == 'yolovany/memoria-claude-plantilla'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sin datos personales
        run: bash .github/privacidad.sh

  humo:
    # Solo en la plantilla: las copias de los usuarios (privadas) no gastan sus minutos de Actions en cada cierre.
    if: github.repository == 'yolovany/memoria-claude-plantilla'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sintaxis
        shell: bash
        run: |
          for f in hooks/*.sh .github/*.sh; do bash -n "$f"; done
          python -m py_compile arnes.py
      - name: Prueba de humo (instalar, hooks, retomar, candado, actualizar)
        shell: bash
        run: bash .github/prueba.sh
